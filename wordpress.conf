<VirtualHost *:9090>
    DocumentRoot /srv/www/wordpress
    <Directory /srv/www/wordpress>
        Options FollowSymLinks
        AllowOverride All
        DirectoryIndex index.php
        Require all granted
    </Directory>
    <Directory /srv/www/wordpress/wp-content>
        Options FollowSymLinks
        Require all granted
    </Directory>

    # Block XML-RPC — prevents pingback abuse and brute-force amplification (vuln 12882)
    <Files xmlrpc.php>
        Require all denied
    </Files>

    # Block direct browser access to plugin .pot / .po translation files (vuln 733431 probe vector)
    <FilesMatch "\.(pot|po)$">
        Require all denied
    </FilesMatch>
</VirtualHost>